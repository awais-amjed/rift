name: rift_bot
description: Write a Rift bot. Auth, commands, and replies against a self-hosted server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  # The app's own crypto, not a second implementation of it — and now a package
  # of its own rather than the whole Flutter app, which this used to drag in to
  # sign a string.
  rift_crypto:
    path: ../rift_crypto
  http: ^1.2.2

dev_dependencies:
  test: ^1.25.0
