name: rift_bot
description: Write a Rift bot. Auth, commands, and replies against a self-hosted server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  # The app's own crypto, not a second implementation of it. See README:
  # everything under `lib/data/repositories/crypto_repository*.dart` is
  # Flutter-free on purpose, which is what makes this dependency possible.
  rift:
    path: ../
  http: ^1.2.2

dev_dependencies:
  test: ^1.25.0
