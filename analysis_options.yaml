# Analyzer configuration. `flutter analyze` must report zero issues, infos
# included; see CODE_STYLE.md §11.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/**   # vendored cargokit
    - tool/**           # untracked local helpers
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - prefer_single_quotes
    - directives_ordering
