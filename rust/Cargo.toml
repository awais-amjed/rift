[package]
name = "rust_lib_rift"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1.49.0", features = ["full"] }
log = "0.4.29"

# Desktop only, and deliberately so.
#
# This crate wants livekit for one thing: capturing a screen and publishing it
# as a track from Rust. libwebrtc gates `desktop_capturer` on exactly these
# three targets, so on Android and iOS that pipeline cannot be compiled at all
# — and a phone shares its screen through the *Dart* SDK's
# `setScreenShareEnabled`, which needs nothing from here.
#
# Leaving it in the general table meant Android built webrtc-sys anyway: a
# whole static libwebrtc, plus an NDK toolchain hunt that fails unless
# ANDROID_NDK_HOME happens to be set, to link code that could never run. Now
# the mobile build never sees it.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
livekit = { version = "0.9.1", features = ["rustls-tls-native-roots"] }

# flutter_rust_bridge installs a logger on Android, iOS and macOS; these two
# get env_logger from src/logging.rs.
#
# nanomp3 decodes Rift's own sounds for the cue player (src/cue), which opens
# the output device chosen in settings. Pure Rust, no unsafe code; it matched
# ffmpeg's decode of every cue to within one step of 32768.
#
# deep_filter is DeepFilterNet, the second noise model on the microphone
# (src/deep_filter.rs), run on tract with its DFN3 model built in. Pinned to
# a commit since crates.io has only a release from before tract. tract is
# held at 0.21.4: later 0.21 releases moved to an ndarray libDF does not build
# against, and tract's crates pin each other, so naming two holds them all.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
env_logger = { version = "0.11", default-features = false }
nanomp3 = "0.2.0"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.22.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Media", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# For the live test in src/screenshare/live_test.rs: minting tokens and
# reading the viewer's frames. Desktop only for the same reason livekit is.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dev-dependencies]
livekit-api = { version = "0.7.1", default-features = false, features = ["access-token"] }
futures-util = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# LiveKit's webrtc-sys with one line changed: WebRTC must not drop frames a
# screen share's GPU encoder already made. See
# third_party/webrtc-sys/RIFT_PATCHES.md for why and when it goes.
[patch.crates-io]
webrtc-sys = { path = "../third_party/webrtc-sys" }
