[package]
name = "rust_lib_rift"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1.49.0", features = ["full"] }
log = "0.4.29"
# Attachments and saved conversations are sealed here rather than in Dart
# (src/blob_cipher.rs): pure Rust, with the CPU's AES and carry-less multiply
# picked at run time, so it builds the same on every target. aead-stream
# is the STREAM construction a big file is sealed with, a chunk at a time.
# sha2 is the digest an unencrypted attachment carries instead of a tag.
aes-gcm = "0.11"
aead-stream = "0.6"
sha2 = "0.11"

# Desktop only, and deliberately so.
#
# This crate wants livekit for one thing: capturing a screen and publishing it
# as a track from Rust. libwebrtc gates `desktop_capturer` on exactly these
# three targets, so on Android and iOS that pipeline cannot be compiled at all
# — and a phone shares its screen through the *Dart* SDK's
# `setScreenShareEnabled`, which needs nothing from here.
#
# Leaving it in the general table meant Android built webrtc-sys anyway: a
# whole static libwebrtc, plus an NDK toolchain hunt that fails unless
# ANDROID_NDK_HOME happens to be set, to link code that could never run. Now
# the mobile build never sees it.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
livekit = { version = "0.9.5", features = ["rustls-tls-native-roots"] }

# flutter_rust_bridge installs a logger on Android, iOS and macOS; these two
# get env_logger from src/logging.rs.
#
# nanomp3 decodes Rift's own sounds for the cue player (src/cue), which opens
# the output device chosen in settings. Pure Rust, no unsafe code; it matched
# ffmpeg's decode of every cue to within one step of 32768.
#
# deep_filter is DeepFilterNet's libDF, for the spectrum DPDFNet works on
# (DFState in src/dpdfnet.rs): no model and no tract, which Rift dropped with
# DeepFilterNet itself. Pinned to the commit it was used at.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Opens Rift's FFmpeg library (native/ffenc) for a share's H264 on the GPU
# (src/screenshare/encoder/ffmpeg.rs), so a computer it cannot load on still
# runs the app.
libloading = "0.9"
env_logger = { version = "0.11", default-features = false }
nanomp3 = "0.2.0"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false }
# ONNX Runtime, for DPDFNet, the noise model in this library
# (src/dpdfnet.rs): tract runs its GRU layers too slowly to keep up. Opened at run time from
# Microsoft's own build, which the runner's CMake downloads and bundles beside
# the app's other libraries. Linked in, it would bring a second protobuf and
# abseil, and clash with libwebrtc's.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
# Velopack installs Rift and replaces it with a newer release (src/updater);
# `public-utils` opens its HTTP download helpers to the update source there.
# ring checks the release key's signature on each release feed (Ed25519), and
# is already in the build through rustls. ureq is Velopack's own HTTP client,
# which the update's pausable download (src/updater/transfer.rs) reads with.
velopack = { version = "=1.2.161", features = ["public-utils"] }
ureq = "3.4"
ring = "0.17"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# The crash handler (src/diagnostics/crash_signal.rs): sigaction, dladdr and a
# raw write, from inside a signal handler. Already in the build through std's
# neighbours.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_EventLog", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Media", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem", "UI_Notifications", "Data_Xml_Dom", "Foundation_Metadata"] }
# `#[implement]` expands to paths in windows-core, so it has to be a direct
# dependency for the ducking listener (`ducking.rs`).
windows-core = "0.62.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# For the live test in src/screenshare/live_test.rs: minting tokens and
# reading the viewer's frames. Desktop only for the same reason livekit is.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dev-dependencies]
livekit-api = { version = "0.9.0", default-features = false, features = ["access-token"] }
futures-util = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# LiveKit's Rust SDKs from our fork's `rift` branch, which changes two things:
# livekit publishes a share's two-channel sound in stereo, and a desktop
# capture can start from a ScreenCast pick Rift already made (Linux, so the
# window's sound can be matched before sharing), and a Windows screen can be
# captured without Windows Graphics Capture's yellow border. RIFT.md on that branch says
# why, and when each change can go. Every crate of LiveKit's this
# library builds comes from the one commit, so they always match.
[patch.crates-io]
livekit = { git = "https://github.com/awais-amjed/livekit-rust-sdks", rev = "6d22ce66d7b0acc61b62ba811eead718918c4e1f" }
livekit-api = { git = "https://github.com/awais-amjed/livekit-rust-sdks", rev = "6d22ce66d7b0acc61b62ba811eead718918c4e1f" }
webrtc-sys = { git = "https://github.com/awais-amjed/livekit-rust-sdks", rev = "6d22ce66d7b0acc61b62ba811eead718918c4e1f" }
