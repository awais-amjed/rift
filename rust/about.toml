# cargo-about: the licence notices for every crate compiled into the native
# library. Run scripts/generate_licenses.sh rather than this directly.
#
# Only permissive licences are accepted, so a dependency that brings in a
# copyleft one fails the generation instead of slipping into the app.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    # Mozilla's list of trusted certificate authorities (webpki-roots, which
    # the updater's HTTP client uses). A licence for data: pass the text on
    # with it, and nothing more.
    "CDLA-Permissive-2.0",
]
# Build scripts and tests do not end up in the shipped library.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# LAME, for the MP3 of a call clip added to the soundboard (src/call_clip),
# and its Rust bindings: LGPL, accepted for these two crates alone (owner's
# call, Nov 21 2026). The app is GPL-3.0 with its source published, so anyone
# can rebuild it against a changed LAME, which is what the LGPL asks of a
# library linked in statically.
[mp3lame-encoder]
accepted = ["LGPL-3.0"]

[mp3lame-sys]
accepted = ["LGPL-3.0"]
