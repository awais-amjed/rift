name: rift
description: "A lightweight voice and video communication app powered by LiveKit."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Bloc
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1

  # Loading
  flutter_easyloading: ^3.0.5
  loading_animation_widget: ^1.3.0

  cupertino_icons: ^1.0.8
  keyboard_dismisser: ^3.0.0
  go_router: ^17.1.0
  intl: ^0.20.2
  sizer: ^3.1.3
  toastification: ^3.0.3
  cached_network_image: ^3.4.1

  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  cross_file: ^0.3.5+2
  path: ^1.9.1

  json_annotation: ^4.11.0
  meta: ^1.17.0
  livekit_client: ^2.6.5
  flutter_webrtc: ^1.3.0
  http: ^1.6.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  flutter_rust_bridge: 2.11.1
  audioplayers: ^6.4.0
  win32_registry: ^2.1.0

  rust_lib_rift:
    path: rust_builder
  supabase: ^2.10.2
  supabase_flutter: ^2.9.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.0.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^22.1.0
  record: ^7.1.1
  emoji_picker_flutter: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.13.0
  build_runner: ^2.12.2
  inno_bundle: ^0.11.2

  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  # Bundled rather than fetched at runtime: without this the app inherits
  # whatever the platform picks, so the same build renders differently on
  # every machine. Geist + Geist Mono, SIL OFL 1.1 (assets/fonts/OFL.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

inno_bundle:
  id: 919df387-f79b-5d74-bee3-b08f176b2a14
  publisher: Coding Fries
  name: Rift
  description: A lightweight voice and video communication app powered by LiveKit.
  installer_icon: assets/images/tray_icon.ico
