name: rift
description: "A lightweight voice and video communication app powered by LiveKit."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.4.0-beta.2+8

environment:
  sdk: ^3.11.1

dependencies:
  # The key ladder and the signing format, in a package with no Flutter in
  # it — so a headless bot SDK can depend on the same copy the app uses
  # rather than on a second implementation of it.
  rift_crypto:
    path: rift_crypto

  flutter:
    sdk: flutter

  # Bloc
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  # hydrated_bloc's own store, opened here rather than by it so the keys an
  # earlier build left can be read once (`HydratedKeyRecovery`).
  hive_ce: ^2.20.0

  # Loading
  flutter_easyloading: ^4.0.2
  loading_animation_widget: ^1.3.0

  cupertino_icons: ^1.0.8
  keyboard_dismisser: ^3.0.0
  go_router: ^18.0.1
  intl: ^0.20.2
  sizer: ^3.1.3
  toastification: ^3.0.3
  cached_network_image: ^4.0.0

  permission_handler: ^13.0.2
  path_provider: ^2.1.5
  # Direct, for the push background isolate: it reads the central session the
  # app persisted without going through Supabase's client, which would refresh
  # and rotate a token the still-running app is holding.
  shared_preferences: ^2.5.3
  cross_file: ^0.3.5+2
  path: ^1.9.1

  json_annotation: ^4.11.0
  meta: ^1.17.0
  # Back on pub.dev as of 2.13.0. Rift ran a fork of this from Aug 2026 for a
  # Linux use-after-free that froze every call leave — the plugin's task runner
  # handed a raw `this` to GLib, and we tap the mic track for the level meter,
  # so a callback was always in flight. Upstream landed an independent fix of
  # the same shape in 2.12.0 (#1177), so the fork is retired; see FORK.md in
  # awais-amjed/livekit-client-sdk-flutter for what it carried.
  livekit_client: ^2.13.0
  flutter_webrtc: ^1.6.2
  # flutter_webrtc's web side, named for its MediaStreamTrackWeb: the mic test
  # plays the browser track behind it (mic_playback_web.dart).
  dart_webrtc: ^1.8.2
  http: ^1.6.0
  http_parser: ^4.1.2
  window_manager: ^0.5.1
  # Already window_manager's own; named here because the window is fitted to
  # the displays before it shows (see fitWindowToScreens).
  screen_retriever: ^0.2.2
  # Already livekit_client's own; named here because the title bar says when
  # the device has no network (see NetworkCubit).
  connectivity_plus: ^7.3.1
  # Already connectivity_plus's own on Linux; read directly because it counts
  # NetworkManager's "limited" as online (see LinuxConnectivity).
  nm: ^0.5.0
  tray_manager: ^0.7.0
  flutter_rust_bridge: 2.13.0
  audioplayers: ^6.4.0
  dbus: ^0.7.15

  rust_lib_rift:
    path: rust_builder
  supabase: ^2.10.2
  supabase_flutter: ^2.9.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  flutter_secure_storage_platform_interface: ^2.1.1
  ffi: ^2.2.0
  win32: ^6.4.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^22.1.0
  record: ^7.1.1
  # Android's foreground service, for calls and for screen sharing. Both need
  # one — a call to survive the app going to the background at all, a capture
  # because Android 14 refuses MediaProjection without one — and they need
  # *different* declared types, which is why this package rather than the one
  # LiveKit's example uses: that one starts with every type in the manifest at
  # once, and a call cannot satisfy mediaProjection's prerequisites.
  flutter_foreground_task: ^11.0.1
  emoji_picker_flutter: ^4.5.3
  app_links: ^7.2.1
  # Browser APIs (Notification, document focus) for the web build. Used only
  # through the `browser_apis_web.dart` half of a conditional export, so it is
  # never reached on native.
  web: ^1.1.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_litert: ^3.8.0
  html: ^0.15.7
  url_launcher: ^6.3.2
  desktop_drop: ^0.8.4
  # Picking and saving files on a phone without holding them in memory:
  # file_selector's Android side reads a picked file whole and has no save
  # dialog at all. file_picker copies a pick to a cache file natively;
  # flutter_file_dialog hands a finished file to the system's save dialog.
  # Desktops and the web keep file_selector (see file_save/save_target.dart).
  file_picker: ^13.1.0
  flutter_file_dialog: ^3.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.13.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3

dependency_overrides:
  # supabase's realtime client, kept in the repository so it can be patched.
  # third_party/realtime_client/RIFT_PATCHES.md says what differs and when this
  # can go.
  realtime_client:
    path: third_party/realtime_client

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/models/
    - assets/licenses/

  # Bundled rather than fetched at runtime: without this the app inherits
  # whatever the platform picks, so the same build renders differently on
  # every machine. Geist + Geist Mono, SIL OFL 1.1 (assets/licenses/geist_ofl.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
