<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="rift">
    <link rel="apple-touch-icon" href="icons/icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Rift</title>
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="loading.css">
</head>
<body>
<!-- Loading screen shown while Flutter initialises -->
<div id="loading-screen">
    <div class="logo-container">
        <div class="logo-icon">
            <!-- The app icon, as assets/brand/rift-tile.svg draws it. -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="rift-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="#7B83FF"/>
                        <stop offset=".52" stop-color="#A56BFA"/>
                        <stop offset="1" stop-color="#EC4899"/>
                    </linearGradient>
                </defs>
                <rect width="100" height="100" rx="22" fill="#08080B"/>
                <path fill="url(#rift-g)" d="M46.5 10 A32 32 0 0 0 46.5 74 Z"/>
                <path fill="url(#rift-g)" d="M53.5 26 A32 32 0 0 1 53.5 90 Z"/>
            </svg>
        </div>
        <div>
            <div class="logo-text"><span>Rift</span></div>
            <div class="logo-tagline">Connecting you in real time</div>
        </div>
    </div>
    <div class="spinner-track"></div>
    <div class="dots">
        <span></span><span></span><span></span>
    </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
    // Remove the loading screen once Flutter signals it is ready
    window.addEventListener('flutter-first-frame', function () {
      var screen = document.getElementById('loading-screen');
      if (screen) {
        screen.classList.add('hidden');
        setTimeout(function () { screen.remove(); }, 450);
      }
    });
</script>
</body>
</html>
