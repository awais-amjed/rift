<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="rift">
    <link rel="apple-touch-icon" href="icons/icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Rift</title>
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="loading.css">
</head>
<body>
<!-- Loading screen shown while Flutter initialises -->
<div id="loading-screen">
    <div class="logo-container">
        <div class="logo-icon">
            <!-- Simple signal / radio waves icon representing "Rift" communication -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M5.636 5.636a9 9 0 1 0 12.728 0"/>
                <path d="M9.172 9.172a4.5 4.5 0 1 0 5.656 0"/>
                <circle cx="12" cy="12" r="1" fill="white" stroke="none"/>
            </svg>
        </div>
        <div>
            <div class="logo-text"><span>Rift</span></div>
            <div class="logo-tagline">Connecting you in real time</div>
        </div>
    </div>
    <div class="spinner-track"></div>
    <div class="dots">
        <span></span><span></span><span></span>
    </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
    // Remove the loading screen once Flutter signals it is ready
    window.addEventListener('flutter-first-frame', function () {
      var screen = document.getElementById('loading-screen');
      if (screen) {
        screen.classList.add('hidden');
        setTimeout(function () { screen.remove(); }, 450);
      }
    });
</script>
</body>
</html>
