# Builds the Windows installer, the Linux AppImage and archive, and the
# update packages, and publishes them as a GitHub Release.
#
# A version tag starts it: scripts/release.sh makes one (v1.0.3, or
# v1.1.0-beta.1 for a pre-release; any tag with a `-` is one). The tag must
# match pubspec.yaml's version, and its message becomes the release notes.
#
# Velopack's vpk packs each platform: the installer and the AppImage, plus a
# full package, a delta from the release before, and the feed
# (releases.<channel>.json) installed copies read. A feed is published
# unsigned, and no installed copy updates to it until
# scripts/sign_release.sh has signed it on the release manager's machine.
#
# Run by hand from the Actions tab, it builds the same files and keeps them
# with the run instead of publishing: a way to try the build without making a
# version.
#
# Forgejo is the source of truth. This runs on the GitHub mirror, which the
# push mirror keeps in step, tags included.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The versions the app is developed against; move them together with it.
  FLUTTER_VERSION: 3.47.5
  RUST_VERSION: 1.97.0
  # vpk must match the velopack crate in rust/Cargo.toml.
  VPK_VERSION: 1.2.161
  REPO_URL: https://github.com/awais-amjed/rift

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          version=${version%%+*}
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match pubspec.yaml's version ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    # A binary needs a glibc at least as new as the one it was built against,
    # so this container sets the floor. It cannot go lower than 24.04 anyway:
    # flutter_litert's prebuilt libtensorflowlite_c needs glibc 2.38, and it
    # loads only when the image classifier first runs, so an older system
    # would start the app and quietly lose the sensitive-image check.
    container: ubuntu:24.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip xz-utils zip file binutils \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpulse-dev libva-dev libayatana-appindicator3-dev gnupg libicu74
      # libwebrtc is built against a libc++ that needs clang 21 or newer, and
      # 24.04 ships 18 (webrtc-sys refuses an older one up front). libclang is
      # for bindgen, which generates the NVENC bindings (shiguredo_nvcodec).
      - name: Install clang 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang-21 libclang-21-dev
      # The container runs as root over folders the runner owns, and git
      # (Flutter's included) refuses to work in those.
      - run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: scripts/package_linux.sh
        env:
          CC: clang-21
          CXX: clang++-21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # vpk_pack.sh finds it in ~/.dotnet/tools, where a global tool goes.
      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: Pack with Velopack
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/vpk_pack.sh linux build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/release/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # First, for the same reason as in scripts/package_linux.sh: cargokit
      # copies whatever rust/target holds.
      - name: Build the Rust library
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc
      - run: ./scripts/build_windows.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: Pack with Velopack
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/vpk_pack.sh win build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/release/*
          if-no-files-found: error

  publish:
    needs: [version, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The checkout holds the tag without its message, which is the notes.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          pre=()
          [[ $VERSION == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Rift $VERSION" --notes-file notes.md "${pre[@]}"
