on:
  push:
    branches: [ production ]

name: Precompile Binaries

jobs:
  Precompile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4 # Updated to v4 for better performance/security

      - uses: dart-lang/setup-dart@v1

      # Linux-specific dependency setup
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libva-dev \
            libvdpau-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libasound2-dev \
            libpulse-dev \
            pkg-config

      - name: Precompile (Windows)
        if: matrix.os == 'windows-latest'
        run: dart run build_tool precompile-binaries -v --manifest-dir=../../../rust --repository=awais-amjed/rift
        working-directory: rust_builder/cargokit/build_tool
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
          RUSTFLAGS: '-C target-feature=+crt-static'

      - name: Precompile (Linux/Android)
        if: matrix.os == 'ubuntu-latest'
        run: dart run build_tool precompile-binaries -v --manifest-dir=../../../rust --repository=awais-amjed/rift
        working-directory: rust_builder/cargokit/build_tool
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
